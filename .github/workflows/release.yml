name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tag matches package version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag must match package.json version $version"; exit 1; }
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if yarn install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency installation failed after $attempt attempts."
              exit 1
            fi
            echo "Dependency installation failed; retrying in 15 seconds (attempt $((attempt + 1))/3)."
            sleep 15
          done
      - name: Build package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: '--max-old-space-size=4096'
        shell: bash
        run: |
          yarn build
          for attempt in 1 2 3; do
            if yarn electron-builder --win --publish never; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then echo "Packaging failed after $attempt attempts."; exit 1; fi
            echo "Packaging failed; retrying in 15 seconds (attempt $((attempt + 1))/3)."
            sleep 15
          done
      - name: Verify update metadata
        shell: bash
        run: |
          channel=$(node -p "(require('./package.json').version.split('-')[1] || 'latest').split('.')[0]")
          test -f "dist/$channel.yml" || { echo "Windows update metadata is missing: $channel.yml"; exit 1; }
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: powerhub-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            !dist/builder-debug.yml
            !dist/builder-effective-config.yaml
          if-no-files-found: error

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tag matches package version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag must match package.json version $version"; exit 1; }
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if yarn install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency installation failed after $attempt attempts."
              exit 1
            fi
            echo "Dependency installation failed; retrying in 15 seconds (attempt $((attempt + 1))/3)."
            sleep 15
          done
      - name: Build package
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          POWERHUB_MAC_CERTIFICATE: ${{ secrets.APP_P12 }}
          POWERHUB_MAC_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$POWERHUB_MAC_CERTIFICATE" ]; then
            export CSC_LINK="$POWERHUB_MAC_CERTIFICATE"
            export CSC_KEY_PASSWORD="$POWERHUB_MAC_CERTIFICATE_PASSWORD"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          yarn build
          for attempt in 1 2 3; do
            if yarn electron-builder --mac --publish never; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then echo "Packaging failed after $attempt attempts."; exit 1; fi
            echo "Packaging failed; retrying in 15 seconds (attempt $((attempt + 1))/3)."
            sleep 15
          done
      - name: Verify update metadata
        shell: bash
        run: |
          channel=$(node -p "(require('./package.json').version.split('-')[1] || 'latest').split('.')[0]")
          test -f "dist/$channel-mac.yml" || { echo "macOS update metadata is missing: $channel-mac.yml"; exit 1; }
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: powerhub-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
            !dist/builder-debug.yml
            !dist/builder-effective-config.yaml
          if-no-files-found: error

  release-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: powerhub-windows
          path: release
      - name: Publish windows artifacts
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'release/*'
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          token: ${{ secrets.GITHUB_TOKEN }}

  release-macos:
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: powerhub-macos
          path: release
      - name: Publish macos artifacts
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'release/*'
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          token: ${{ secrets.GITHUB_TOKEN }}

