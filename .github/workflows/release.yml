name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            command: yarn build:win --publish never
          - os: macos-14
            platform: macos
            command: yarn build:mac --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tag matches package version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag must match package.json version $version"; exit 1; }
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: ${{ matrix.command }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: powerhub-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: powerhub-*
          path: release
          merge-multiple: true
      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'release/*'
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          token: ${{ secrets.GITHUB_TOKEN }}
